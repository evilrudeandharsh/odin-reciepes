<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <div class="main">
        <h1 class="jersey-15-regular" style="font-size: 100px;">Tic Tac Toe</h1>
    </div>
    <div class="container">
        <div class="sides">
            <h1 class="jersey-15-regular" style="font-size: 50px;">YOU:
            </h1>
            <h1 class="jersey-15-regular" style="font-size: 50px;">BOT:
            </h1>
            
        </div>
        <div class="gameboard">
            
        </div>
        <div class="sides">
            <div id="winner-message"></div>
            <button id="reset">Restart Game</button>
        </div>
        
    </div>
    
 

</body>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function () {
            const game = {
                turn: "X",
                board: ["", "", "", "", "", "", "", "", ""],
                moves: 0,

                init: function () {
                    this.renderBoard();
                    this.addEventListeners();
                },

                renderBoard: function () {
                    const gameboard = $(".gameboard");
                    gameboard.empty(); // Clear the board
                    for (let i = 0; i < 9; i++) {
                        gameboard.append(`<div class="grid-item" data-index="${i}"></div>`);
                    }
                },

                addEventListeners: function () {
                    const self = this;

                    
                    $(".gameboard").on("click", ".grid-item", function () {
                        
       
                        const index = $(this).data("index");

                        // Check if the cell is already taken
                        if (self.board[index] !== "") return;

                        // Mark the cell with the current player's symbol
                        self.board[index] = self.turn;
                        $(this).html(`<div class="grid-${self.turn}">${self.turn}</div>`);
                        $(this).addClass("grid-taken");

                        self.moves++;

                        // Check for a winner
                        if (self.checkWinner()) {
                            $("#winner-message").text(`Player ${self.turn} wins!`);
                            $(".grid-item").addClass("grid-taken"); // Lock the board
                        } 
                        else if (self.moves === 9) {
                            $("#winner-message").text("It's a draw!");

                        } 
                        else {
                            // Switch turns                                            
                            self.turn = self.turn === "X" ? "O" : "X";

                        }
                    });
                
                    
                    $("#reset").on("click", function () {
                        self.resetGame();
                    });
                },

                checkWinner: function () {
                    const winningCombos = [
                        [0, 1, 2],
                        [3, 4, 5],
                        [6, 7, 8],
                        [0, 3, 6],
                        [1, 4, 7],
                        [2, 5, 8],
                        [0, 4, 8],
                        [2, 4, 6],
                                          ]  ;

                    return winningCombos.some((combo) => {
                        const [a, b, c] = combo;
                        return (
                            this.board[a] &&
                            this.board[a] == this.board[b] &&
                            this.board[a] == this.board[c]

                        );
                    });
                },

                resetGame: function () {
                    this.turn = "X";
                    this.board = ["", "", "", "", "", "", "", "", ""];
                    this.moves = 0;
                    $("#winner-message").text("");
                    this.renderBoard();
                },
            };

            game.init();
        });
</script>
</html>
