<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Scores:</h2>
    <p>Human Wins: <span id="human-score">0</span></p>
    <p>Computer Wins: <span id="computer-score">0</span></p>
    <button id="rock">rock</button>
    <button id="scissor">scissor</button>
    <button id="paper">paper</button>

</body>
<script>
    let humanwins=0;
    let computerwins=0;
    function getRandomInt(max) {
        return Math.floor(Math.random() * max);
    }
    
    function playround(humanchoice,computerchoice){
        if(humanchoice==1){
            if(computerchoice==1){
                console.log('draw');
            }
            else if(computerchoice==2){
                console.log('HUMAN LOST');
                computerwins++;
            }
            else{
                console.log('HUMAN WON');
                humanwins++;
            }
        
        }
        else if(humanchoice==2){
            if(computerchoice==2){
                console.log('draw');
            }
            else if(computerchoice==3){
                console.log('HUMAN LOST');
                computerwins++;
            }
            else{
                console.log('HUMAN WON');
                humanwins++;
            }
        }
        else{
            if(computerchoice==3){
                console.log('draw');
            }
            else if(computerchoice==1){
                console.log('HUMAN LOST');
                computerwins++;
            }
            else {
                console.log('HUMAN WON');
                humanwins++;
            }
        }
        document.getElementById('human-score').innerText = humanwins;
        document.getElementById('computer-score').innerText = computerwins;

    }
    
    document.getElementById("rock").addEventListener("click", function() {
        playround(1, getRandomInt(3));
    });

    document.getElementById("scissor").addEventListener("click", function() {
        playround(3, getRandomInt(3));
    });

    document.getElementById("paper").addEventListener("click", function() {
        playround(2, getRandomInt(3));
    });
    
    


    
</script>
</html>
